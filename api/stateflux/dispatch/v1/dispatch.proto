// dispatch.proto —— 跨节点分发能力契约（proto3）。
//
// 定位：调度侧把任务投递/转发到远端执行节点的分发契约；channel 选择与执行节点
// 选择全部留在调度侧，执行侧不做任何调度决策（§1.2.7/§5.3）。生成码仅模块内 import。
// 消息与服务定义按设计文档在实施阶段落定，当前仅占位包名与路径。
syntax = "proto3";

package stateflux.dispatch.v1;

option go_package = "github.com/improvtrace/stateflux/api/stateflux/dispatch/v1;dispatchv1";
