// dispatch.proto —— 内部契约（proto3，§3.3/§7）。
//
// TaskMessage 是跨节点传输的统一任务信封：异步队列 LPUSH 消息体与同步 Execute RPC 请求共用，
// 内联完整任务（payload 创建后不可变，内联安全；>64KB 由业务方走对象存储引用），
// 执行侧 BRPOP 后零 PG 读；PG 仍是状态与 payload 的唯一权威。
syntax = "proto3";

package stateflux.dispatch.v1;

option go_package = "github.com/improvtrace/stateflux/proto/gen/dispatchv1;dispatchv1";

// 任务优先级，与 Redis 队列 stateflux:queue:{pri} 一一对应（§3.2）。
enum Priority {
  PRIORITY_UNSPECIFIED = 0;
  PRIORITY_HIGH = 1;
  PRIORITY_NORMAL = 2;
  PRIORITY_LOW = 3;
}

// 统一任务信封（§3.3）。字段借鉴 Machinery 的 Signature（UUID/Name/ETA/Priority/Headers）。
message TaskMessage {
  // 雪花 ID，与 PG 任务行对应。
  int64 task_id = 1;
  // fencing token：认领时的 attempts 值；执行侧注册与结果回写校验的依据。
  int64 attempt = 2;
  // 任务类型（Handler 注册名）。
  string type = 3;
  // 任务载荷（内联完整任务）。
  bytes payload = 4;
  // 执行控制。
  Priority priority = 5;
  int64 timeout_ms = 6;
  // 绝对截止时间（unix 毫秒）；同步 Execute 的 gRPC deadline 由此换算。
  int64 deadline_unix_ms = 7;
  // 链路追踪传播（W3C 头，Machinery Headers 同款用途）。optional 显式表达存在性。
  map<string, string> trace_headers = 8;
}

// 一次执行的结果条目。同步任务随 ExecuteResponse 返回（调度侧归集，不经 WAL）；
// 异步任务先落执行侧结果 WAL，再由 Collect 拉取归集（§5.4/§5.5）。
message ResultEntry {
  int64 task_id = 1;
  int64 attempt = 2;
  // succeeded / failed / dead。执行侧只产生 succeeded / failed；dead 由对账与重试耗尽判定。
  string outcome = 3;
  // handler 返回的业务结果（原样透传，终态事务内写入 task_results）。
  bytes result = 4;
  // 失败错误摘要。
  string error = 5;
  // 执行完成时间（unix 毫秒）。
  int64 completed_at_unix_ms = 6;
  // 业务标记为不可重试的失败（sdk.NonRetryable）：终态为 failed，不进入重试路径。
  bool non_retryable = 7;
}

message ExecuteRequest {
  TaskMessage task = 1;
}

message ExecuteResponse {
  ResultEntry result = 1;
}

message CollectRequest {
  // 拉取上限（调用方分页拉取，WAL 在 Ack 前保留）。
  int32 limit = 1;
}

message CollectResponse {
  repeated ResultEntry results = 1;
}

message AckRequest {
  // 已成功归集的任务 ID 列表；执行侧推进 WAL 截断水位并移出 inprocess（§5.5）。
  repeated int64 task_ids = 1;
}

message AckResponse {}

// 执行角色对内提供的服务（所有节点，§7）：
//   Execute —— 同步任务执行（带 deadline）；
//   Collect/Ack —— 异步结果归集（pull + Ack 两段式）。
service ExecutorService {
  rpc Execute(ExecuteRequest) returns (ExecuteResponse);
  rpc Collect(CollectRequest) returns (CollectResponse);
  rpc Ack(AckRequest) returns (AckResponse);
}
