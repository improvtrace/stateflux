# 本地开发中间件栈：PostgreSQL（任务表组，唯一权威）+ Redis（实时视图）。
# 生产环境请自备 HA 实例（README「准备中间件」）；本文件仅服务本地开发与冒烟。
# 启停：hack/dev.sh up / hack/dev.sh down
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: stateflux
      POSTGRES_PASSWORD: stateflux
      POSTGRES_DB: stateflux
    ports:
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U stateflux -d stateflux"]
      interval: 2s
      timeout: 2s
      retries: 30

  redis:
    image: redis:7-alpine
    ports:
      - "127.0.0.1:6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 2s
      retries: 30
